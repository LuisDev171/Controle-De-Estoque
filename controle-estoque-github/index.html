<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Controle de Estoque</title>
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#F2F8F6; --surface:#FFFFFF; --surface-2:#E2F1ED; --line:#CFE3DD;
  --fg:#0F2A26; --muted:#486660; --accent:#0F766E; --on-accent:#FFFFFF; --accent-text:#0B5F58;
  --ok:#166534; --ok-bg:#DCFCE7; --warn:#92400E; --warn-bg:#FEF3C7; --bad:#B3261E; --bad-bg:#FBE4E2;
  --shadow:0 6px 24px rgba(15,42,38,.10);
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08181A; --surface:#0F2527; --surface-2:#16363A; --line:#234548;
    --fg:#E8FAF6; --muted:#9CC4BC; --accent:#2DD4BF; --on-accent:#042F2B; --accent-text:#5EEAD4;
    --ok:#86EFAC; --ok-bg:#12301F; --warn:#FCD34D; --warn-bg:#3A2D0B; --bad:#FF8A80; --bad-bg:#3A1717;
    --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);
  padding:max(0px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(104px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px}
.app{max-width:640px;margin:0 auto}
header.top{display:flex;align-items:center;gap:12px;padding:18px 0 8px}
.logo{width:46px;height:46px;border-radius:14px;flex:none}
.top h1{margin:0;font-size:21px;line-height:1.15;letter-spacing:-.01em}
.top .sub{margin:0;font-size:14px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.icon-btn{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h2.sec{font-size:19px;margin:22px 0 10px;letter-spacing:-.01em;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.sec small{font-size:14px;font-weight:600;color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.card .lb{font-size:14px;color:var(--muted);font-weight:600}
.card .vl{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.card .ft{font-size:13px;color:var(--muted);margin-top:2px}
.card.hero{grid-column:1/-1;background:linear-gradient(135deg,#0F766E,#0B4F4A);border-color:transparent;color:#fff}
.card.hero .lb,.card.hero .ft{color:#BDF3EA}
.card.hero .vl{font-size:34px}
.card.alert .vl{color:var(--warn)}
.card.alert.zero .vl{color:var(--bad)}
.card.alert.none .vl{color:var(--ok)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px}
.item.low{border-color:#E8B24A}
.item.out{border-color:#E58A82}
.item .nm{font-weight:700;font-size:16px;overflow-wrap:anywhere;text-align:left;background:none;border:0;padding:0;line-height:1.25}
.item .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:4px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:700;line-height:1;display:grid;place-items:center;color:var(--accent-text)}
.stepper button:active{transform:scale(.94)}
.stepper .q{min-width:52px;text-align:center;font-weight:800;font-size:20px;line-height:1.1}
.stepper .q small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;grid-column:1/-1}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.item.low .bar i{background:#D98E04}
.item.out .bar i{background:var(--bad)}
.toolbar{display:flex;flex-direction:column;gap:10px;margin:6px 0 12px}
.search{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin:0 -2px}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.wa{background:#15803D;border-color:#15803D;color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:30px 14px;background:var(--surface);border:1.5px dashed var(--line);border-radius:18px}
.empty b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.day{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.mv{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px}
.mv .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.mv .ic svg{width:22px;height:22px}
.mv.entrada .ic{background:var(--ok-bg);color:var(--ok)}
.mv.saida .ic{background:var(--warn-bg);color:var(--warn)}
.mv.ajuste .ic{background:var(--surface-2);color:var(--accent-text)}
.mv .t{font-weight:700;overflow-wrap:anywhere}
.mv .d{font-size:13px;color:var(--muted)}
.mv .n{font-weight:800;font-size:18px;text-align:right}
.mv.entrada .n{color:var(--ok)}
.mv.saida .n{color:var(--warn)}
.buy{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 12px}
.buy input[type=checkbox]{width:26px;height:26px;accent-color:var(--accent)}
.buy .t{font-weight:700;overflow-wrap:anywhere}
.buy .d{font-size:13px;color:var(--muted)}
.buy .qty{width:84px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);text-align:center;font-weight:800;font-size:18px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-size:14px;font-weight:700}
.field input,.field select{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);padding:0 12px;width:100%}
.field .hint{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:14px}
.seg button{min-height:46px;border-radius:10px;border:0;background:transparent;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:20px;margin:-4px 0 8px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1.5px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs button{min-height:58px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);border-radius:12px;position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--accent-text);background:var(--surface-2)}
nav.tabs .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px}
.back{position:fixed;inset:0;background:rgba(5,20,18,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 12px}
.sheet h3{margin:0 0 2px;font-size:21px;overflow-wrap:anywhere}
.sheet .sub{color:var(--muted);margin:0 0 14px;font-size:15px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .btn{flex:1;min-width:130px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0F2A26;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note{font-size:13px;color:var(--muted);margin:14px 0 0;text-align:center}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0B5F58"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#lg)" stroke="none"/><g transform="translate(256 262)" stroke="none"><path d="M-138 -62 L0 -128 L138 -62 L138 78 L0 144 L-138 78 Z" fill="#E6FFFA"/><path d="M-138 -62 L0 4 L138 -62 L0 -128 Z" fill="#fff"/><path d="M0 4 L0 144 L-138 78 L-138 -62 Z" fill="#99F6E4"/><path d="M-70 -95 L68 -29 L68 12 L-70 -54 Z" fill="#0F766E" opacity=".9"/></g></svg>
    <div class="grow"><h1 id="loja">Controle de Estoque</h1><p class="sub" id="subt">Tudo certo por aqui</p></div>
    <button class="icon-btn" id="btnCfg" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* ===== ÍCONES ===== */
var IC={
 painel:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>',
 caixa:'<svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3.3 7.5L12 12l8.7-4.5M12 22V12"/></svg>',
 hist:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>',
 cart:'<svg viewBox="0 0 24 24"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/></svg>',
 down:'<svg viewBox="0 0 24 24"><path d="M12 4v13M6 11l6 6 6-6M5 21h14"/></svg>',
 up:'<svg viewBox="0 0 24 24"><path d="M12 20V7M6 13l6-6 6 6M5 3h14"/></svg>',
 adj:'<svg viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>',
 wa:'<svg viewBox="0 0 24 24"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c.3 2.7 2.8 5.2 5.5 5.5l1.2-1.3-2.2-1.1-.8.7a4 4 0 0 1-2-2l.7-.8-1.1-2.2z"/></svg>',
 plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'
};

/* ===== DADOS ===== */
var KEY='estoque-v1';
var UNS=['un','kg','L','pct','cx'];
var S, V={tab:'painel',q:'',cat:'Todas',hf:'todos',cmp:{}};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function demo(){
  var P=[
   ['Arroz 5kg','Mercearia',14,8,'un',19.5,26.9],['Feijão carioca 1kg','Mercearia',6,10,'un',6.2,8.9],
   ['Açúcar 1kg','Mercearia',22,10,'un',3.9,5.5],['Óleo de soja 900ml','Mercearia',3,8,'un',5.8,7.9],
   ['Macarrão espaguete','Mercearia',30,12,'pct',2.9,4.5],['Café 500g','Mercearia',9,6,'pct',13.5,18.9],
   ['Refrigerante 2L','Bebidas',24,12,'un',6.4,9.5],['Água mineral 1,5L','Bebidas',0,12,'un',1.6,3],
   ['Cerveja lata 350ml','Bebidas',48,24,'un',2.9,4.5],['Suco de uva 1L','Bebidas',5,6,'un',7.5,10.9],
   ['Detergente 500ml','Limpeza',18,8,'un',1.9,3.2],['Água sanitária 2L','Limpeza',4,6,'un',4.2,6.5],
   ['Sabão em pó 1kg','Limpeza',11,5,'un',9.9,14.9],['Queijo mussarela','Frios',3.5,2,'kg',32,44.9],
   ['Presunto fatiado','Frios',1.2,2,'kg',24,34.9],['Papel higiênico 12un','Higiene',16,8,'pct',14.5,21.9],
   ['Sabonete','Higiene',40,20,'un',1.4,2.5],['Creme dental','Higiene',7,6,'un',3.8,6.2]
  ];
  var now=Date.now(), prods=P.map(function(p,i){return {id:'d'+i,nome:p[0],cat:p[1],qtd:p[2],min:p[3],un:p[4],custo:p[5],venda:p[6]}});
  var H=[
   [1,'saida',0,2,'Venda balcão'],[2,'saida',7,12,'Venda do dia'],[3,'entrada',6,24,'Compra distribuidora'],
   [5,'saida',3,4,'Venda balcão'],[26,'entrada',0,10,'Reposição semanal'],[27,'saida',1,6,'Venda do dia'],
   [50,'entrada',8,24,'Compra distribuidora'],[52,'saida',11,3,'Venda balcão']
  ].map(function(h,i){var p=prods[h[2]];return {id:'h'+i,ts:now-h[0]*36e5,pid:p.id,nome:p.nome,un:p.un,tipo:h[1],qtd:h[3],depois:p.qtd,obs:h[4]}});
  return {loja:'Mercadinho Demo',zap:'5512992498702',produtos:prods,hist:H,demo:true};
}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.produtos)return s}catch(e){}return demo()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste aparelho')}}
S=load();

/* ===== UTIL ===== */
function $(s,r){return (r||document).querySelector(s)}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN}
function fq(n){n=Math.round(n*1000)/1000;return String(n).replace('.',',')}
function brl(n){return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function round3(n){return Math.round(n*1000)/1000}
function status(p){return p.qtd<=0?'out':(p.qtd<=p.min?'low':'ok')}
function find(id){for(var i=0;i<S.produtos.length;i++)if(S.produtos[i].id===id)return S.produtos[i]}
function cats(){var o=[];S.produtos.forEach(function(p){if(p.cat&&o.indexOf(p.cat)<0)o.push(p.cat)});return o.sort()}
function sug(p){return Math.max(Math.ceil(p.min*2-p.qtd),1)}
function low(){return S.produtos.filter(function(p){return p.qtd<=p.min}).sort(function(a,b){return (a.qtd/(a.min||1))-(b.qtd/(b.min||1))})}
var tt;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2400)}
function dayLabel(ts){
  var d=new Date(ts),n=new Date(),a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((b-a)/864e5);
  if(diff===0)return 'Hoje';if(diff===1)return 'Ontem';
  return d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'});
}
function hhmm(ts){return new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}

/* ===== MOVIMENTAÇÃO ===== */
function mover(p,tipo,q,obs){
  var antes=p.qtd,depois;
  if(tipo==='entrada')depois=antes+q;else if(tipo==='saida')depois=antes-q;else depois=q;
  depois=round3(depois);
  var delta=tipo==='ajuste'?round3(depois-antes):q;
  if(tipo==='ajuste'&&delta===0)return;
  p.qtd=depois;
  S.hist.unshift({id:uid(),ts:Date.now(),pid:p.id,nome:p.nome,un:p.un,tipo:tipo,qtd:delta,depois:depois,obs:obs||''});
  if(S.hist.length>600)S.hist.length=600;
  save();
}

/* ===== RENDER ===== */
function renderTabs(){
  var n=low().length;
  var T=[['painel','Painel',IC.painel],['prod','Produtos',IC.caixa],['hist','Histórico',IC.hist],['compras','Compras',IC.cart]];
  $('#tabs').innerHTML=T.map(function(t){
    return '<button data-tab="'+t[0]+'"'+(V.tab===t[0]?' aria-current="page"':'')+'>'+t[2]+t[1]+(t[0]==='compras'&&n?'<span class="dot" aria-label="'+n+' itens para repor">'+n+'</span>':'')+'</button>';
  }).join('');
}
function renderHead(){
  $('#loja').textContent=S.loja||'Controle de Estoque';
  var n=low().length;
  $('#subt').textContent=n?(n+(n===1?' produto para repor':' produtos para repor')):'Tudo certo por aqui';
}
function itemHtml(p,showCat){
  var st=status(p),pct=p.min>0?Math.min(100,Math.round(p.qtd/(p.min*2)*100)):(p.qtd>0?100:0);
  var pill=st==='out'?'<span class="pill bad">Sem estoque</span>':st==='low'?'<span class="pill warn">Acabando</span>':'<span class="pill ok">Em dia</span>';
  return '<div class="item '+st+'">'
   +'<div><button class="nm" data-open="'+p.id+'">'+esc(p.nome)+'</button>'
   +'<div class="meta">'+pill+(showCat?'<span>'+esc(p.cat||'Sem categoria')+'</span>':'')+'<span>mín. '+fq(p.min)+' '+esc(p.un)+'</span></div></div>'
   +'<div class="stepper"><button data-dec="'+p.id+'" aria-label="Retirar 1 '+esc(p.un)+' de '+esc(p.nome)+'">−</button>'
   +'<div class="q" aria-label="'+fq(p.qtd)+' '+esc(p.un)+' em estoque">'+fq(p.qtd)+'<small>'+esc(p.un)+'</small></div>'
   +'<button data-inc="'+p.id+'" aria-label="Adicionar 1 '+esc(p.un)+' em '+esc(p.nome)+'">+</button></div>'
   +'<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div></div>';
}
function viewPainel(){
  var tot=0,valorV=0;S.produtos.forEach(function(p){tot+=p.qtd*(p.custo||0);valorV+=p.qtd*(p.venda||0)});
  var L=low(),zero=S.produtos.filter(function(p){return p.qtd<=0}).length;
  var h='<div class="cards">'
   +'<div class="card hero"><div class="lb">Dinheiro parado no estoque (custo)</div><div class="vl">'+brl(tot)+'</div><div class="ft">Se tudo for vendido: '+brl(valorV)+'</div></div>'
   +'<div class="card"><div class="lb">Produtos</div><div class="vl">'+S.produtos.length+'</div><div class="ft">cadastrados</div></div>'
   +'<div class="card alert '+(L.length?'':'none')+'"><div class="lb">Acabando</div><div class="vl">'+L.length+'</div><div class="ft">'+(L.length?'para repor':'nenhum alerta')+'</div></div>'
   +(zero?'<div class="card alert zero" style="grid-column:1/-1"><div class="lb">Sem estoque agora</div><div class="vl">'+zero+(zero===1?' produto':' produtos')+'</div><div class="ft">o cliente pode pedir e você não ter</div></div>':'')
   +'</div>';
  h+='<h2 class="sec">Precisa repor'+(L.length?'<small>'+L.length+' '+(L.length===1?'item':'itens')+'</small>':'')+'</h2>';
  if(L.length){h+='<div class="list">'+L.slice(0,5).map(function(p){return itemHtml(p,false)}).join('')+'</div>';
    h+='<div class="actions" style="margin-top:12px"><button class="btn primary block" data-tab="compras">'+IC.cart+'Montar lista de compras</button></div>';}
  else h+='<div class="empty"><b>Estoque em dia</b>Nenhum produto abaixo do mínimo.</div>';
  var rec=S.hist.slice(0,4);
  h+='<h2 class="sec">Últimas movimentações<small><a href="#" data-tab="hist" style="color:var(--accent-text);font-weight:700">ver tudo</a></small></h2>';
  h+=rec.length?'<div class="list">'+rec.map(mvHtml).join('')+'</div>':'<div class="empty"><b>Nada por aqui ainda</b>Use + e − nos produtos para começar.</div>';
  return h;
}
function listHtml(){
  var q=V.q.trim().toLowerCase();
  var A=S.produtos.filter(function(p){return (V.cat==='Todas'||p.cat===V.cat)&&(!q||p.nome.toLowerCase().indexOf(q)>=0)})
   .sort(function(a,b){var o={out:0,low:1,ok:2};return o[status(a)]-o[status(b)]||a.nome.localeCompare(b.nome,'pt-BR')});
  if(!S.produtos.length)return '<div class="empty"><b>Nenhum produto ainda</b>Toque em “Novo produto” para cadastrar o primeiro.</div>';
  if(!A.length)return '<div class="empty"><b>Nada encontrado</b>Tente outro nome ou categoria.</div>';
  return '<div class="list">'+A.map(function(p){return itemHtml(p,true)}).join('')+'</div>';
}
function viewProd(){
  var C=['Todas'].concat(cats());
  return '<div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar produto" aria-label="Buscar produto" value="'+esc(V.q)+'" autocomplete="off">'
   +'<div class="chips" role="group" aria-label="Categorias">'+C.map(function(c){return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(V.cat===c)+'">'+esc(c)+'</button>'}).join('')+'</div>'
   +'<button class="btn primary block" id="btnNew">'+IC.plus+'Novo produto</button></div><div id="plist">'+listHtml()+'</div>';
}
function mvHtml(h){
  var ic=h.tipo==='entrada'?IC.down:h.tipo==='saida'?IC.up:IC.adj;
  var lab=h.tipo==='entrada'?'Entrada':h.tipo==='saida'?'Saída':'Ajuste';
  var sg=h.tipo==='entrada'?'+':h.tipo==='saida'?'−':(h.qtd>0?'+':'−');
  var val=h.tipo==='ajuste'?Math.abs(h.qtd):h.qtd;
  return '<div class="mv '+h.tipo+'"><div class="ic">'+ic+'</div><div><div class="t">'+esc(h.nome)+'</div><div class="d">'+lab+' · '+hhmm(h.ts)+(h.obs?' · '+esc(h.obs):'')+'</div></div>'
   +'<div class="n">'+sg+fq(val)+' <small style="font-size:12px;color:var(--muted)">'+esc(h.un||'')+'</small><div class="d" style="font-weight:600">resta '+fq(h.depois)+'</div></div></div>';
}
function viewHist(){
  var F=[['todos','Tudo'],['entrada','Entradas'],['saida','Saídas'],['ajuste','Ajustes']];
  var A=S.hist.filter(function(h){return V.hf==='todos'||h.tipo===V.hf});
  var h='<h2 class="sec">Histórico</h2><div class="chips" role="group" aria-label="Filtrar">'+F.map(function(f){return '<button class="chip" data-hf="'+f[0]+'" aria-pressed="'+(V.hf===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>';
  if(!A.length)return h+'<div class="empty" style="margin-top:12px"><b>Sem movimentações</b>Tudo o que entrar ou sair do estoque aparece aqui.</div>';
  var last='';
  A.forEach(function(x){var d=dayLabel(x.ts);if(d!==last){h+='<div class="day">'+esc(d)+'</div>';last=d}h+='<div class="list" style="margin-bottom:8px">'+mvHtml(x)+'</div>'});
  return h;
}
function buyList(){
  return low().map(function(p){var o=V.cmp[p.id]||{};return {p:p,on:o.on!==false,qtd:o.qtd!=null?o.qtd:sug(p)}});
}
function viewCompras(){
  var L=buyList();
  var h='<h2 class="sec">Lista de compras</h2>';
  if(!L.length)return h+'<div class="empty"><b>Nada para comprar</b>Quando um produto chegar no mínimo, ele aparece aqui sozinho.</div>';
  h+='<p style="margin:0 0 12px;color:var(--muted)">Sugestão: repor até o dobro do mínimo. Ajuste a quantidade se quiser.</p><div class="list">';
  h+=L.map(function(r){var p=r.p;return '<div class="buy"><input type="checkbox" data-bon="'+p.id+'"'+(r.on?' checked':'')+' aria-label="Incluir '+esc(p.nome)+'">'
   +'<div><div class="t">'+esc(p.nome)+'</div><div class="d">Tem '+fq(p.qtd)+' '+esc(p.un)+' · mín. '+fq(p.min)+'</div></div>'
   +'<input class="qty" inputmode="decimal" data-bq="'+p.id+'" value="'+fq(r.qtd)+'" aria-label="Quantidade de '+esc(p.nome)+'"></div>'}).join('')+'</div>';
  h+='<div class="field" style="margin-top:16px"><label for="zap">WhatsApp do fornecedor</label><input id="zap" inputmode="tel" placeholder="(12) 99999-9999" value="'+esc(S.zapForn||'')+'"><span class="hint">Com DDD. Se deixar em branco, você escolhe o contato no WhatsApp.</span></div>';
  h+='<button class="btn wa block" id="btnBuy">'+IC.wa+'Enviar lista no WhatsApp</button>';
  return h;
}
function render(){
  renderHead();renderTabs();
  var v=$('#view');
  v.innerHTML=V.tab==='painel'?viewPainel():V.tab==='prod'?viewProd():V.tab==='hist'?viewHist():viewCompras();
}

/* ===== SHEETS ===== */
var lastFocus=null;
function openSheet(html){
  if(!$('#back'))lastFocus=document.activeElement;
  $('#layer').innerHTML='<div class="back" id="back"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div></div>';
  var f=$('#layer input,#layer button.btn');if(f&&window.innerWidth>0)setTimeout(function(){try{f.focus()}catch(e){}},30);
}
function closeSheet(){$('#layer').innerHTML='';if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}}

var M={id:null,tipo:'entrada'};
function sheetMov(id,tipo){
  var p=find(id);if(!p)return;M.id=id;M.tipo=tipo||M.tipo;
  var t=M.tipo,lab=t==='entrada'?'Quantidade que entrou':t==='saida'?'Quantidade que saiu':'Quantidade real contada';
  var cta=t==='entrada'?'Registrar entrada':t==='saida'?'Registrar saída':'Corrigir estoque';
  openSheet('<h3>'+esc(p.nome)+'</h3><p class="sub">Em estoque: <b>'+fq(p.qtd)+' '+esc(p.un)+'</b> · mínimo '+fq(p.min)+' '+esc(p.un)+'</p>'
   +'<div class="seg" role="group" aria-label="Tipo de movimentação"><button data-mt="entrada" aria-pressed="'+(t==='entrada')+'">Entrada</button><button data-mt="saida" aria-pressed="'+(t==='saida')+'">Saída</button><button data-mt="ajuste" aria-pressed="'+(t==='ajuste')+'">Ajuste</button></div>'
   +'<div class="field"><label for="mq">'+lab+' ('+esc(p.un)+')</label><input id="mq" inputmode="decimal" placeholder="0" autocomplete="off"></div>'
   +'<div class="field"><label for="mo">Observação (opcional)</label><input id="mo" maxlength="60" placeholder="'+(t==='entrada'?'Ex.: compra do distribuidor':t==='saida'?'Ex.: venda, perda, vencido':'Ex.: contagem do fim do mês')+'"></div>'
   +'<div class="err" id="merr" role="alert"></div>'
   +'<button class="btn primary block" id="mgo">'+cta+'</button>'
   +'<div class="actions" style="margin-top:10px"><button class="btn" id="medit">Editar produto</button><button class="btn" id="mclose">Fechar</button></div>');
}
function sheetProd(id){
  var p=id?find(id):null,cs=cats();
  openSheet('<h3>'+(p?'Editar produto':'Novo produto')+'</h3><p class="sub">'+(p?'Mude os dados e salve.':'Preencha o básico, o resto é opcional.')+'</p>'
   +'<div class="field"><label for="pn">Nome</label><input id="pn" maxlength="60" value="'+esc(p?p.nome:'')+'" placeholder="Ex.: Arroz 5kg" autocomplete="off"></div>'
   +'<div class="row2"><div class="field"><label for="pc">Categoria</label><input id="pc" list="cl" maxlength="30" value="'+esc(p?p.cat:(V.cat!=='Todas'?V.cat:''))+'" placeholder="Ex.: Mercearia"><datalist id="cl">'+cs.map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div>'
   +'<div class="field"><label for="pu">Unidade</label><select id="pu">'+UNS.map(function(u){return '<option'+((p?p.un:'un')===u?' selected':'')+'>'+u+'</option>'}).join('')+'</select></div></div>'
   +'<div class="row2"><div class="field"><label for="pq">'+(p?'Quantidade atual':'Quantidade inicial')+'</label><input id="pq" inputmode="decimal" value="'+(p?fq(p.qtd):'0')+'"'+(p?' disabled':'')+'>'+(p?'<span class="hint">Para mudar, use Entrada, Saída ou Ajuste.</span>':'')+'</div>'
   +'<div class="field"><label for="pm">Estoque mínimo</label><input id="pm" inputmode="decimal" value="'+(p?fq(p.min):'5')+'"><span class="hint">Abaixo disso, avisa.</span></div></div>'
   +'<div class="row2"><div class="field"><label for="pcu">Preço de custo (R$)</label><input id="pcu" inputmode="decimal" value="'+(p&&p.custo?fq(p.custo):'')+'" placeholder="0,00"></div>'
   +'<div class="field"><label for="pv">Preço de venda (R$)</label><input id="pv" inputmode="decimal" value="'+(p&&p.venda?fq(p.venda):'')+'" placeholder="0,00"></div></div>'
   +'<div class="err" id="perr" role="alert"></div>'
   +'<button class="btn primary block" id="pgo" data-id="'+(p?p.id:'')+'">'+(p?'Salvar alterações':'Cadastrar produto')+'</button>'
   +'<div class="actions" style="margin-top:10px">'+(p?'<button class="btn danger" id="pdel" data-id="'+p.id+'">Excluir</button>':'')+'<button class="btn" id="mclose">Cancelar</button></div>');
}
function sheetCfg(){
  openSheet('<h3>Configurações</h3><p class="sub">Dados guardados só neste aparelho.</p>'
   +'<div class="field"><label for="cn">Nome da loja</label><input id="cn" maxlength="40" value="'+esc(S.loja||'')+'"></div>'
   +'<div class="actions"><button class="btn primary" id="cgo">Salvar nome</button></div>'
   +'<h3 style="font-size:17px;margin:22px 0 6px">Backup</h3><p class="sub" style="margin-bottom:10px">Baixe uma cópia dos dados para não perder se trocar de celular.</p>'
   +'<div class="actions"><button class="btn" id="cexp">Baixar backup</button><label class="btn" for="cimp" style="cursor:pointer">Restaurar backup</label><input id="cimp" type="file" accept="application/json,.json" hidden></div>'
   +'<h3 style="font-size:17px;margin:22px 0 6px">Começar do zero</h3><p class="sub" style="margin-bottom:10px">'+(S.demo?'Você está vendo dados de exemplo. Apague para cadastrar os seus.':'Apaga todos os produtos e o histórico deste aparelho.')+'</p>'
   +'<div class="actions"><button class="btn danger" id="cclear">Apagar tudo</button><button class="btn" id="mclose">Fechar</button></div>');
}

/* ===== EVENTOS ===== */
document.addEventListener('click',function(e){
  var t=e.target.closest('button,a,[data-tab]');
  if(e.target.id==='back'){closeSheet();return}
  if(!t)return;
  var d=t.dataset;
  if(d.tab){e.preventDefault();V.tab=d.tab;render();window.scrollTo(0,0);return}
  if(t.id==='btnCfg'){sheetCfg();return}
  if(t.id==='btnNew'){sheetProd();return}
  if(t.id==='mclose'){closeSheet();return}
  if(d.cat!=null&&t.classList.contains('chip')){V.cat=d.cat;render();return}
  if(d.hf){V.hf=d.hf;render();return}
  if(d.open){M.tipo='entrada';sheetMov(d.open,'entrada');return}
  if(d.inc||d.dec){
    var p=find(d.inc||d.dec);if(!p)return;
    if(d.dec&&p.qtd<=0){toast('Já está zerado');return}
    mover(p,d.inc?'entrada':'saida',1,d.inc?'Ajuste rápido':'Ajuste rápido');
    var y=window.scrollY;render();window.scrollTo(0,y);return;
  }
  if(d.mt){var keep=$('#mq')?$('#mq').value:'';sheetMov(M.id,d.mt);$('#mq').value=keep;return}
  if(t.id==='mgo'){
    var p2=find(M.id),q=num($('#mq').value),err=$('#merr');
    if(!(q>=0)||(M.tipo!=='ajuste'&&q<=0)){err.textContent=M.tipo==='ajuste'?'Digite a quantidade contada (pode ser 0).':'Digite uma quantidade maior que zero.';$('#mq').focus();return}
    if(M.tipo==='saida'&&q>p2.qtd){err.textContent='Só tem '+fq(p2.qtd)+' '+p2.un+' em estoque.';$('#mq').focus();return}
    mover(p2,M.tipo,q,$('#mo').value.trim());closeSheet();render();
    toast(M.tipo==='entrada'?'Entrada registrada':M.tipo==='saida'?'Saída registrada':'Estoque corrigido');return;
  }
  if(t.id==='medit'){sheetProd(M.id);return}
  if(t.id==='pgo'){
    var n=$('#pn').value.trim(),pe=$('#perr'),id=d.id;
    if(!n){pe.textContent='Digite o nome do produto.';$('#pn').focus();return}
    var dup=S.produtos.some(function(x){return x.id!==id&&x.nome.toLowerCase()===n.toLowerCase()});
    if(dup){pe.textContent='Já existe um produto com esse nome.';return}
    var mi=num($('#pm').value),cu=num($('#pcu').value),ve=num($('#pv').value),qi=id?0:num($('#pq').value);
    if(!(mi>=0)){pe.textContent='O estoque mínimo precisa ser um número.';return}
    if(!id&&!(qi>=0)){pe.textContent='A quantidade inicial precisa ser um número.';return}
    var obj=id?find(id):{id:uid(),qtd:0};
    obj.nome=n;obj.cat=$('#pc').value.trim();obj.un=$('#pu').value;obj.min=mi;obj.custo=isNaN(cu)?0:cu;obj.venda=isNaN(ve)?0:ve;
    if(!id){S.produtos.push(obj);if(qi>0)mover(obj,'entrada',qi,'Estoque inicial');}
    if(S.demo&&!id){}
    save();closeSheet();render();toast(id?'Produto atualizado':'Produto cadastrado');return;
  }
  if(t.id==='pdel'){
    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Toque de novo para excluir';return}
    S.produtos=S.produtos.filter(function(x){return x.id!==d.id});save();closeSheet();render();toast('Produto excluído');return;
  }
  if(t.id==='cgo'){S.loja=$('#cn').value.trim()||'Controle de Estoque';save();closeSheet();render();toast('Nome salvo');return}
  if(t.id==='cexp'){
    var b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download='backup-estoque-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup baixado');return;
  }
  if(t.id==='cclear'){
    if(t.dataset.arm!=='1'){t.dataset.arm='1';t.textContent='Toque de novo para apagar tudo';return}
    S={loja:S.loja==='Mercadinho Demo'?'Minha Loja':S.loja,zap:S.zap,produtos:[],hist:[]};save();closeSheet();V.cat='Todas';V.q='';V.cmp={};V.tab='prod';render();toast('Tudo limpo. Cadastre o primeiro produto.');return;
  }
  if(t.id==='btnBuy'){
    var L=buyList().filter(function(r){return r.on&&r.qtd>0});
    if(!L.length){toast('Marque pelo menos um item');return}
    var msg='Olá! '+(S.loja?'Aqui é da '+S.loja+'. ':'')+'Preciso repor o estoque:\n\n'+L.map(function(r){return '• '+fq(r.qtd)+' '+r.p.un+' de '+r.p.nome}).join('\n')+'\n\nPode me passar o valor e o prazo? Obrigado!';
    var z=($('#zap').value||'').replace(/\D/g,'');if(z&&z.length<=11)z='55'+z;
    S.zapForn=$('#zap').value;save();
    var a2=document.createElement('a');a2.href='https://wa.me/'+z+'?text='+encodeURIComponent(msg);a2.target='_blank';a2.rel='noopener noreferrer';document.body.appendChild(a2);a2.click();a2.remove();return;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){V.q=t.value;$('#plist').innerHTML=listHtml();return}
  if(t.dataset&&t.dataset.bq){var n=num(t.value);V.cmp[t.dataset.bq]=V.cmp[t.dataset.bq]||{};V.cmp[t.dataset.bq].qtd=isNaN(n)?0:n;if(!(n>0)){}return}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.bon){V.cmp[t.dataset.bon]=V.cmp[t.dataset.bon]||{};V.cmp[t.dataset.bon].on=t.checked;return}
  if(t.id==='cimp'&&t.files[0]){
    var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||!Array.isArray(o.produtos)||!Array.isArray(o.hist))throw 0;S=o;delete S.demo;save();closeSheet();V.cat='Todas';V.q='';render();toast('Backup restaurado')}catch(x){toast('Arquivo de backup inválido')}};
    r.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&$('#back'))closeSheet();
  if(e.key==='Enter'){var id=e.target.id;if(id==='mq'||id==='mo'){$('#mgo').click()}}
});

render();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
</body>
</html>
